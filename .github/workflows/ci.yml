name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  commit-lint:
    name: 📝 Commitlint (Conventional Commits)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - run: npm install --no-save @commitlint/cli @commitlint/config-conventional
      - name: Validate PR commits
        run: npx commitlint --from=${{ github.event.pull_request.base.sha }} --to=${{ github.event.pull_request.head.sha }} --verbose

  lint-root:
    name: 🧹 Lint root (ruff + prettier + hygiene)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run pre-commit on all files
        run: pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: conventional-pre-commit

  ruff-check:
    name: 🐍 Ruff (lint + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format (check only)
        run: ruff format --check .

  pytest:
    name: 🧪 Pytest smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: pip install pytest pytest-asyncio pytest-cov
      - name: Run tests
        run: pytest -v

  markdown-lint:
    name: 📄 Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Install markdownlint
        run: npm install --no-save markdownlint-cli2
      - name: Lint markdown
        run: npx markdownlint-cli2 "**/*.md" "#node_modules" "#firmware"
        continue-on-error: true

  secrets-scan:
    name: 🔒 Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  all-green:
    name: ✅ All checks green
    runs-on: ubuntu-latest
    needs: [lint-root, ruff-check, pytest, markdown-lint, secrets-scan]
    if: always()
    steps:
      - name: Verify all required checks passed
        run: |
          if [[ "${{ needs.lint-root.result }}" != "success" ]] \
          || [[ "${{ needs.ruff-check.result }}" != "success" ]] \
          || [[ "${{ needs.pytest.result }}" != "success" ]] \
          || [[ "${{ needs.secrets-scan.result }}" != "success" ]]; then
            echo "One or more required checks failed"
            exit 1
          fi
          echo "All required checks passed ✅"
