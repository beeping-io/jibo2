name: CI

on:
  push:
    branches:
      - develop
      - main
      - "milestone/**"
      - "feat/**"
      - "fix/**"
      - "docs/**"
      - "chore/**"
      - "refactor/**"
      - "perf/**"
      - "test/**"
      - "ci/**"
      - "build/**"
      - "style/**"
      - "revert/**"
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  commit-lint:
    name: 📝 Commitlint (Conventional Commits)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-save @commitlint/cli @commitlint/config-conventional
      - name: Validate PR commits
        run: npx commitlint --from=${{ github.event.pull_request.base.sha }} --to=${{ github.event.pull_request.head.sha }} --verbose

  lint-root:
    name: 🧹 Lint root (ruff + prettier + hygiene)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run pre-commit on all files
        run: pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: conventional-pre-commit

  ruff-check:
    name: 🐍 Ruff (lint + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: uv sync (dev deps)
        run: uv sync --frozen
      - name: Ruff lint + format (via Makefile)
        run: make lint

  pytest:
    name: 🧪 Pytest + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: uv sync (dev deps)
        run: uv sync --frozen
      - name: Run tests with coverage (fails if < 70%)
        run: make test-cov
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 30

  markdown-lint:
    name: 📄 Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install markdownlint
        run: npm install --no-save markdownlint-cli2
      - name: Lint markdown
        run: npx markdownlint-cli2 "**/*.md" "#node_modules" "#firmware"
        continue-on-error: true

  verify-tools:
    name: 🛠️ Verify tools (uv + Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: uv --version
        run: uv --version
      - name: Install managed Python 3.12
        run: uv python install 3.12
      - name: Verify Python 3.12 reachable via uv
        run: uv run --python 3.12 python --version

  secrets-scan:
    name: 🔒 Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan repository
        run: gitleaks detect --source . --verbose --redact --no-git

  all-green:
    name: ✅ All checks green
    runs-on: ubuntu-latest
    needs: [verify-tools, lint-root, ruff-check, pytest, markdown-lint, secrets-scan]
    if: always()
    steps:
      - name: Verify all required checks passed
        run: |
          if [[ "${{ needs.verify-tools.result }}" != "success" ]] \
          || [[ "${{ needs.lint-root.result }}" != "success" ]] \
          || [[ "${{ needs.ruff-check.result }}" != "success" ]] \
          || [[ "${{ needs.pytest.result }}" != "success" ]] \
          || [[ "${{ needs.secrets-scan.result }}" != "success" ]]; then
            echo "One or more required checks failed"
            exit 1
          fi
          echo "All required checks passed ✅"
