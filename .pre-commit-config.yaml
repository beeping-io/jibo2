# Pre-commit hooks for Jibo2
# Install: pip install pre-commit && pre-commit install --hook-type commit-msg --hook-type pre-commit
# Run manually: pre-commit run --all-files

default_language_version:
  python: python3.12

repos:
  # ─── Generic hygiene ───
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # ─── Secrets detection ───
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # ─── Python (ruff strict) ───
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # ─── Markdown / JSON / YAML formatting ───
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.3.3
    hooks:
      - id: prettier
        types_or: [markdown, json, yaml]
        exclude: "^\\.claude/|^firmware/|^docs/PRODUCTO\\.md$"

  # ─── Conventional Commits (commit message) ───
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: []
